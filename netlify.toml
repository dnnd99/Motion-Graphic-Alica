[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/generate-canvas-code"
  to = "/.netlify/functions/generate-canvas-code"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
